name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Unit and structure tests
        run: npm test

      - name: Theme Check (Shopify's official linter, run through Shopify CLI 3.x)
        run: npm run theme:check
